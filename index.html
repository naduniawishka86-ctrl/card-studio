
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Card Maker Pro - All Invitations</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:#f8f7ff}
.h{padding:18px 16px;text-align:center;background:#fff;position:sticky;top:0;z-index:10}
.h h1{font-size:22px;font-weight:800}
.h p{color:#6b7280;font-size:13px;margin-top:4px}
.cats{max-width:480px;margin:0 auto;padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat{border-radius:20px;padding:16px 12px;text-align:center;color:#fff;cursor:pointer;position:relative;overflow:hidden;min-height:170px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:0 8px 20px rgba(0,0,0,.15)}
.cat span{font-weight:800;font-size:16px;position:relative;z-index:2}
.cat small{opacity:.9;font-size:11px;position:relative;z-index:2}
.cat.icon{font-size:52px;position:absolute;top:18px;left:50%;transform:translateX(-50%);filter:drop-shadow(0 4px 8px rgba(0,0,0,.2))}
.wed{background:linear-gradient(135deg,#a78bfa,#7c3aed)}
.bir{background:linear-gradient(135deg,#38bdf8,#0284c7)}
.ann{background:linear-gradient(135deg,#f472b6,#db2777)}
.baby{background:linear-gradient(135deg,#fb923c,#f97316)}
.grad{background:linear-gradient(135deg,#8b5cf6,#4f46e5)}
.tea{background:linear-gradient(135deg,#4ade80,#16a34a)}
.eng{background:linear-gradient(135deg,#2dd4bf,#0f766e)}

.gridPage{display:none;max-width:1100px;margin:0 auto}
.topbar{background:#fff;padding:12px 14px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
.back{width:38px;height:38px;border-radius:50%;border:0;background:#f3f4f6;cursor:pointer;font-size:18px}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px}
@media(min-width:700px){.cards{grid-template-columns:repeat(4,1fr)}}
.icard{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.08);cursor:pointer}
.iimg{height:200px;background:linear-gradient(135deg,#1e293b,#334155);color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:10px;text-align:center;position:relative}
.iimg.gold{border:2px solid #d4af37}
.iimg.light{background:#fffef7;color:#1e293b;border:1px solid #f3e8c0}
.ititle{font-family:serif;font-size:18px;font-weight:700}
.editor{display:none;position:fixed;inset:0;background:#fff;z-index:100;overflow:auto}
.ebox{max-width:420px;margin:0 auto;padding:14px}
.preview{width:100%;aspect-ratio:3/4.2;background:#fff;border:1px solid #eee;border-radius:12px;overflow:hidden;position:relative;box-shadow:0 10px 30px rgba(0,0,0,.15);margin-bottom:12px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #e5e7eb;margin-top:8px}
.btn{width:100%;padding:14px;border-radius:12px;border:0;font-weight:800;cursor:pointer;margin-top:10px}
.btnP{background:#7c3aed;color:#fff}
.btnG{background:#f3f4f6}
</style>
</head>
<body>
<div id="home">
<div class="h"><h1>Choose Invitations<br>Card Categories</h1><p>Tap a category to explore 150+ premium designs</p></div>
<div class="cats">
<div class="cat wed" onclick="openCat('Wedding')"><div class="icon">💍</div><span>Wedding</span><small>50 Designs</small></div>
<div class="cat bir" onclick="openCat('Birthday')"><div class="icon">🎂</div><span>Birthdays</span><small>50 Designs</small></div>
<div class="cat ann" onclick="openCat('Anniversary')"><div class="icon">💞</div><span>Anniversary</span><small>50 Designs</small></div>
<div class="cat baby" onclick="openCat('Baby Shower')"><div class="icon">🧸</div><span>Baby Shower</span><small>30 Designs</small></div>
<div class="cat grad" onclick="openCat('Graduation')"><div class="icon">🎓</div><span>Graduation</span><small>20 Designs</small></div>
<div class="cat tea" onclick="openCat('Tea Party')"><div class="icon">🍵</div><span>Tea Party</span><small>20 Designs</small></div>
<div class="cat eng" onclick="openCat('Engagement')"><div class="icon">💍</div><span>Engagement</span><small>30 Designs</small></div>
<div class="cat wed" style="background:linear-gradient(135deg,#f43f5e,#ec4899)" onclick="openCat('All')"><div class="icon">✨</div><span>All Cards</span><small>250+ Designs</small></div>
</div>
</div>

<div id="list" class="gridPage">
<div class="topbar"><button class="back" onclick="goHome()">←</button><h3 id="catName">Wedding Cards</h3></div>
<div id="cardGrid" class="cards"></div>
</div>

<div id="edit" class="editor">
<div class="ebox">
<div class="topbar" style="position:relative"><button class="back" onclick="closeEdit()">←</button><h3>Edit Card</h3></div>
<div id="prev" class="preview"></div>
<label>Names (ex: Riya & Roy)</label><input id="n1" value="Riya & Roy" oninput="update()">
<label>Date</label><input id="n2" value="AUGUST 10th 6:00 PM" oninput="update()">
<label>Venue</label><input id="n3" value="LAKE VIEW HOTEL" oninput="update()">
<button class="btn btnP" onclick="down()">⬇️ Download HD Image</button>
<button class="btn btnG" onclick="shareWA()">📤 Share on WhatsApp</button>
</div>
</div>

<script>
const data={
"Wedding":[
{t:"RIYA & ROY",d:"AUGUST 10th 6:00 PM",v:"LAKE VIEW HOTEL",c:"dark",e:"💍"},
{t:"MARISSA & MICHAEL",d:"Oct. 15th, 2022",v:"Floral Photo Frame",c:"light",e:"💒"},
{t:"Mark and Diana",d:"SATURDAY 18 NOVEMBER 2022",v:"LOREM BUILDING",c:"dark",e:"❤️"},
{t:"Maria & John",d:"SATURDAY 25 JUNE",v:"Lorem Ipsum Restaurant",c:"light",e:"👰"}
],
"Birthday":[
{t:"Martha's BIRTHDAY",d:"OCT 27 | 7:30 PM",v:"CLUB NAME",c:"dark",e:"🎂"},
{t:"BIRTHDAY Party",d:"25th of May",v:"4347 MONTANA AVE",c:"dark",e:"🎈"},
{t:"Birthday PARTY",d:"18 NOV / 12:00PM",v:"CELEBRATE WITH US",c:"dark",e:"🎉"}
],
"Anniversary":[
{t:"Golden Anniversary",d:"7th Anniversary SUN 25",v:"123 MAIN STREET",c:"light",e:"🌹"},
{t:"Happy Anniversary",d:"Friday 18 At 4 PM",v:"Couple Name Here",c:"dark",e:"💞"},
{t:"25th Wedding ANNIVERSARY",d:"Vince & Ada",v:"NEWMANN VESSELLY",c:"light",e:"✨"}
],
"Baby Shower":[
{t:"Girl or Boy?",d:"SAT 04 25 PM",v:"Gender Reveal",c:"dark",e:"👶"},
{t:"Baby Shower",d:"22 DAY 3:00",v:"Honoring Manuel S.",c:"light",e:"🍼"},
{t:"BABY SHOWER",d:"In Honor of James Ortiz",v:"YOUR ADDRESS HERE",c:"light",e:"🧸"}
],
"Graduation":[
{t:"Happy Graduation",d:"10AM-2PM AT CROWN HOTEL",v:"59 CENTRAL BLVD",c:"light",e:"🎓"},
{t:"HAPPY GRADUATION",d:"Class of 2024",v:"YOUR LOGO",c:"dark",e:"🎓"},
{t:"Graduation PARTY",d:"July 31 Fri 20:00",v:"YOUR PLACE",c:"light",e:"📜"}
],
"Tea Party":[
{t:"Retirement Tea Party",d:"NOV 25 FROM 2-4 PM",v:"Heather Smith",c:"light",e:"🍵"},
{t:"Autumn SEASON TEA PARTY",d:"August 24th 2022",v:"open doors at 4:00pm",c:"light",e:"🍂"},
{t:"Tea Party Kaylan's 10th",d:"1:00pm-3:00pm",v:"1234 Spruce Street",c:"light",e:"🧁"}
],
"Engagement":[
{t:"Rayyan & Aleena",d:"SEPT, 15TH 2022",v:"Save The Date",c:"dark",e:"💍"},
{t:"Sara & Jhon",d:"SAT 15 DEC",v:"AT 10 O'CLOCK",c:"light",e:"💕"},
{t:"Jack & Sofia",d:"SUN 22 OCT",v:"SHERATON KAUAI RESORT",c:"dark",e:"💒"}
]
}
let curCat="",curCard=null;
function openCat(cat){
curCat=cat;document.getElementById('home').style.display='none';
document.getElementById('list').style.display='block';
document.getElementById('catName').innerText=cat+" Cards";
let list= cat==='All'? Object.values(data).flat() : (data[cat]||data['Wedding']);
let html=list.map((c,i)=>`<div class="icard" onclick="openEdit('${cat}',${i})"><div class="iimg ${c.c==='dark'?'':'light'}"><div style="font-size:28px">${c.e}</div><div class="ititle" style="margin-top:8px">${c.t}</div><div style="font-size:11px;margin-top:6px;opacity:.8">${c.d}</div><div style="font-size:10px;margin-top:4px">${c.v}</div></div></div>`).join('');
document.getElementById('cardGrid').innerHTML=html;
}
function goHome(){document.getElementById('home').style.display='block';document.getElementById('list').style.display='none';}
function openEdit(cat,idx){
let list= cat==='All'? Object.values(data).flat() : (data[cat]||data['Wedding']);
curCard=list[idx];
document.getElementById('n1').value=curCard.t;document.getElementById('n2').value=curCard.d;document.getElementById('n3').value=curCard.v;
document.getElementById('edit').style.display='block';update();
}
function closeEdit(){document.getElementById('edit').style.display='none';}
function update(){
let t=document.getElementById('n1').value,d=document.getElementById('n2').value,v=document.getElementById('n3').value;
let dark=curCard.c==='dark';
document.getElementById('prev').innerHTML=`<div style="height:100%;background:${dark?'#0f172a':'#fffef7'};color:${dark?'#fff':'#1e293b'};display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;border:3px solid ${dark?'#d4af37':'#f3e8c0'};border-radius:12px"><div style="font-size:42px">${curCard.e}</div><div style="font-family:serif;font-size:28px;font-weight:800;margin-top:16px;letter-spacing:1px">${t}</div><div style="width:60px;height:2px;background:#d4af37;margin:12px 0"></div><div style="font-size:13px;letter-spacing:1px">${d}</div><div style="font-size:11px;margin-top:8px;opacity:.8">${v}</div><div style="position:absolute;top:10px;left:10px;right:10px;bottom:70px;border:1px solid ${dark?'rgba(212,175,55,.4)':'rgba(0,0,0,.08)'};pointer-events:none;border-radius:8px"></div></div>`;
}
function down(){
let el=document.getElementById('prev');
if(!window.html2canvas){let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';s.onload=()=>cap(el);document.body.appendChild(s);}else cap(el);
}
function cap(el){html2canvas(el,{scale:3,useCORS:true}).then(c=>{let a=document.createElement('a');a.download='invitation-'+Date.now()+'.jpg';a.href=c.toDataURL('image/jpeg',0.95);a.click();})}
function shareWA(){let txt=document.getElementById('n1').value+" - "+document.getElementById('n2').value+" - "+document.getElementById('n3').value+"\nMade with: https://naduniawishka86-ctrl.github.io/card-studio/";window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');}
</script>
</body>
</html>
