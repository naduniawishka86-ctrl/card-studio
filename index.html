
<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Card Studio Pro - 150 Cards</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui;background:#f6f3ff;min-height:100vh}header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #eee;padding:12px 16px;text-align:center}.tabs{display:flex;gap:8px;justify-content:center;margin:12px 0;flex-wrap:wrap}.tab{border:0;padding:10px 18px;border-radius:999px;font-weight:600;cursor:pointer;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.1)}.tab.active{background:#7c3aed;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;padding:16px;max-width:1100px;margin:0 auto}.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.08);cursor:pointer}.card-img{height:140px;display:flex;align-items:center;justify-content:center;font-size:48px;background:linear-gradient(135deg,#ede9fe,#fce7f3)}.card-body{padding:10px}.card-title{font-size:13px;font-weight:600;min-height:36px}.badge{display:inline-block;margin-top:6px;font-size:11px;background:#f3f0ff;color:#6d28d9;padding:3px 8px;border-radius:999px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}.modal.open{display:flex}.modal-box{background:#fff;border-radius:20px;max-width:420px;width:100%;overflow:hidden}.modal-img{height:220px;display:flex;align-items:center;justify-content:center;font-size:80px;background:linear-gradient(135deg,#ddd6fe,#fbcfe8)}.modal-body{padding:16px}.btns{display:flex;gap:8px;margin-top:12px}.btn{flex:1;padding:12px;border-radius:12px;border:0;font-weight:700;cursor:pointer}.btn-primary{background:#7c3aed;color:#fff}.btn-ghost{background:#f3f4f6}</style></head><body><header><div style="font-size:22px">💌 Card Studio Pro - 150 Cards</div><div class="tabs"><button class="tab active" data-cat="Wedding">Wedding 50</button><button class="tab" data-cat="Birthday">Birthday 50</button><button class="tab" data-cat="Anniversary">Anniversary 50</button></div></header><div id="grid" class="grid"></div><div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="modal-box"><div id="mImg" class="modal-img"></div><div class="modal-body"><h3 id="mTitle"></h3><p id="mText" style="margin-top:8px;color:#4b5563"></p><div class="btns"><button class="btn btn-ghost" onclick="closeModal()">Close</button><button class="btn btn-primary" onclick="shareCard()">Share / Copy</button></div></div></div></div><script>const emojis={Wedding:["💍","💒","👰","🤵","💐","🥂","❤️","💕"],Birthday:["🎂","🎉","🎁","🎈","🥳","🍰","🎊","💝"],Anniversary:["💞","❤️","🌹","💑","💏","🥰","💖","✨"]};const templates={Wedding:["Two souls, one heart - Happy Wedding Day!","Wishing you a lifetime of love and happiness","May your love story be as magical as today","Together is a beautiful place to be","Cheers to love, laughter and happily ever after"],Birthday:["Happy Birthday! Make a wish!","Wishing you joy, love and cake!","Another year wiser, another year fabulous","May your day be filled with surprises","Celebrate big, you deserve it!"],Anniversary:["Happy Anniversary to my favorite couple","One year down, forever to go","Love grows more beautiful every year","Cheers to your amazing journey together","Still falling for you every day"]};function makeCards(){let all=[];["Wedding","Birthday","Anniversary"].forEach(cat=>{for(let i=1;i<=50;i++){let t=templates[cat][(i-1)%templates[cat].length];let e=emojis[cat][i%emojis[cat].length];all.push({id:cat+"-"+i,cat,title:cat+" Card #"+i,text:t,emoji:e})}});return all}const CARDS=makeCards();let active="Wedding";let selected=null;function render(){const grid=document.getElementById('grid');const filtered=CARDS.filter(c=>c.cat===active);grid.innerHTML=filtered.map(c=>`<div class="card" onclick="openModal('${c.id}')"><div class="card-img">${c.emoji}</div><div class="card-body"><div class="card-title">${c.text}</div><span class="badge">${c.cat} #${c.id.split('-')[1]}</span></div></div>`).join('')}function openModal(id){selected=CARDS.find(c=>c.id===id);document.getElementById('mImg').textContent=selected.emoji;document.getElementById('mTitle').textContent=selected.title;document.getElementById('mText').textContent=selected.text;document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}function shareCard(){if(!selected)return;const txt=selected.title+"\n\n"+selected.text+"\n\nMade with Card Studio Pro";if(navigator.share){navigator.share({title:selected.title,text:txt})}else{navigator.clipboard.writeText(txt);alert('Copied!')}}document.querySelectorAll('.tab').forEach(b=>{b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');active=b.dataset.cat;render()})});render();</script></body></html>
